name: Build MotionGram Studio Android APK (com.motiongram.app)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    name: Build MotionGram Studio Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout MotionGram Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21 (Required by Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Fix Kotlin Stdlib Duplicate Classes in Gradle
        run: |
          echo "Applying kotlin-stdlib exclusions to android/build.gradle..."
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          subprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          echo "Applying kotlin-stdlib exclusions to android/app/build.gradle..."
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Set Custom Purple Vector App Icon
        run: |
          cat << 'EOF' > /tmp/ic_launcher_purple.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="512dp"
              android:height="512dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
              <path
                  android:pathData="M115,0 L397,0 C460,0 512,52 512,115 L512,397 C512,460 460,512 397,512 L115,512 C52,512 0,460 0,397 L0,115 C0,52 52,0 115,0 Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="512"
                          android:endY="512"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#FF4C1D95" />
                          <item android:offset="0.5" android:color="#FF7C3AED" />
                          <item android:offset="1.0" android:color="#FFC026D3" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:pathData="M140,320 C120,220 200,130 310,130 C370,130 400,170 380,230 C360,290 310,330 240,330"
                  android:strokeColor="#FFE879F9"
                  android:strokeWidth="26"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M372,192 C392,292 312,382 202,382 C142,382 112,342 132,282 C152,222 202,182 272,182"
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="20"
                  android:strokeLineCap="round"
                  android:strokeAlpha="0.9" />
              <path
                  android:pathData="M180,300 L225,210 L256,260 L287,210 L332,300"
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="24"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round" />
              <path
                  android:pathData="M256,256 m-14,0 a14,14 0 1,1 28,0 a14,14 0 1,1 -28,0"
                  android:fillColor="#FFFDE047" />
              <path
                  android:pathData="M395,95 m-14,0 a14,14 0 1,1 28,0 a14,14 0 1,1 -28,0"
                  android:fillColor="#FFF43F5E" />
          </vector>
          EOF
          find android/app/src/main/res -name "ic_launcher*.xml" -exec cp /tmp/ic_launcher_purple.xml {} + || true

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Rename Generated APK
        run: |
          mkdir -p apk_output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_output/MotionGram-Studio.apk

      - name: Upload MotionGram APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionGram-Studio-APK
          path: apk_output/MotionGram-Studio.apk
          retention-days: 14
          if-no-files-found: error
