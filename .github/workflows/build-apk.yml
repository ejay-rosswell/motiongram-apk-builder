name: Build MotionGram Android APK (com.motiongram.app & Purple Icon)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    name: Build Native Telegram Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free Disk Space on Runner
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout Telegram Android Source (DrKlo)
        uses: actions/checkout@v4
        with:
          repository: 'DrKlo/Telegram'
          submodules: 'recursive'
          fetch-depth: 1

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Exact NDK 27.2.12479018 via sdkmanager
        run: |
          echo "Installing NDK version 27.2.12479018..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          df -h

      - name: Configure Telegram API Credentials
        run: |
          cat <<EOF > local.properties
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_HOME/ndk/27.2.12479018
          APP_ID=31757989
          APP_HASH=c75cf21b4b0e26bbc878f74dd298ba72
          EOF

      - name: Set App Name to MotionGram
        run: |
          # Rename Application display name to MotionGram in strings.xml
          find . -name "strings.xml" -exec sed -i 's/<string name="AppName">Telegram<\/string>/<string name="AppName">MotionGram<\/string>/g' {} + || true
          find . -name "strings.xml" -exec sed -i 's/<string name="AppNameBeta">Telegram Beta<\/string>/<string name="AppNameBeta">MotionGram<\/string>/g' {} + || true

      - name: Set Hardcoded Package Name to com.motiongram.app
        run: |
          echo "Applying com.motiongram.app to gradle.properties and build.gradle files..."
          # 1. Update APP_PACKAGE in root gradle.properties
          sed -i 's/APP_PACKAGE=org.telegram.messenger/APP_PACKAGE=com.motiongram.app/g' gradle.properties
          
          # 2. Update all build.gradle files (remove .web suffix that standalone appends)
          find . -name "build.gradle" -exec sed -i 's/applicationIdSuffix ".web"/applicationIdSuffix ""/g' {} + || true
          find . -name "build.gradle" -exec sed -i 's/defaultConfig.applicationId = APP_PACKAGE/defaultConfig.applicationId = "com.motiongram.app"/g' {} + || true
          find . -name "build.gradle" -exec sed -i 's/"org.telegram.messenger.web"/"com.motiongram.app"/g' {} + || true
          find . -name "build.gradle" -exec sed -i 's/"org.telegram.messenger"/"com.motiongram.app"/g' {} + || true

      - name: Replace Telegram Plane with Kinetic Purple Motion Logo
        run: |
          echo "Overwriting background gradient and icon foregrounds with Electric Purple Motion Theme..."
          
          # 1. Replace icon background with Vibrant Purple to Fuchsia Gradient
          cat << 'EOF' > TMessagesProj/src/main/res/drawable/icon_background_sa.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="90"
                  android:startColor="#4C1D95"
                  android:centerColor="#7C3AED"
                  android:endColor="#C026D3" />
          </shape>
          EOF

          cat << 'EOF' > TMessagesProj/src/main/res/drawable/icon_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="90"
                  android:startColor="#4C1D95"
                  android:centerColor="#7C3AED"
                  android:endColor="#C026D3" />
          </shape>
          EOF

          # 2. Replace the paper plane vector with the Kinetic Motion 'M' Iris
          cat << 'EOF' > TMessagesProj/src/main/res/drawable/icon_plane.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="90dp"
              android:height="90dp"
              android:viewportWidth="90"
              android:viewportHeight="90">
              <!-- Kinetic Outer Motion Wave -->
              <path
                  android:pathData="M24,56 C20,38 35,22 55,22 C65,22 70,29 67,40 C63,51 54,58 42,58"
                  android:strokeColor="#FFE879F9"
                  android:strokeWidth="5"
                  android:strokeLineCap="round" />
              <!-- Velocity Ring -->
              <path
                  android:pathData="M65,33 C68,51 54,67 35,67 C24,67 19,60 23,49 C26,38 35,31 47,31"
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="3.5"
                  android:strokeLineCap="round"
                  android:strokeAlpha="0.9" />
              <!-- Sharp Kinetic "M" Core -->
              <path
                  android:pathData="M31,53 L39,37 L45,46 L51,37 L59,53"
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="4.5"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round" />
              <!-- Glowing Yellow Focal Center -->
              <path
                  android:pathData="M45,45 m-2.5,0 a2.5,2.5 0 1,1 5,0 a2.5,2.5 0 1,1 -5,0"
                  android:fillColor="#FFFDE047" />
          </vector>
          EOF

          # 3. Transparentize or replace legacy png foregrounds so the vector renders directly
          cat << 'EOF' > TMessagesProj_AppStandalone/src/main/res/mipmap-anydpi-v26/ic_launcher_sa.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/icon_background_sa" />
              <foreground android:drawable="@drawable/icon_plane" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > TMessagesProj/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/icon_background" />
              <foreground android:drawable="@drawable/icon_plane" />
          </adaptive-icon>
          EOF

      - name: Inject 1:1 iOS UI Theme, Bubble Radius & Colors
        run: |
          cat << 'EOF' > TMessagesProj/src/main/res/values/colors_ios_motiongram.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ios_telegram_blue">#007AFF</color>
              <color name="ios_bubble_out">#E1FEC6</color>
              <color name="ios_bubble_in">#FFFFFF</color>
              <color name="ios_chat_bg">#EFEFF4</color>
              <color name="ios_header_bg">#F6F6F6</color>
              <color name="ios_ticks">#3B9844</color>
          </resources>
          EOF

      - name: Build MotionGram Standalone APK (arm64-v8a)
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug -PtargetAbi=arm64-v8a --no-daemon --stacktrace

      - name: Locate & Rename Generated APK
        run: |
          echo "Locating built APK..."
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          echo "Found APK at: $APK_FILE"
          mkdir -p apk_output
          cp "$APK_FILE" apk_output/MotionGram-com.motiongram.app-purple.apk

      - name: Upload MotionGram APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionGram-iOS-APK
          path: apk_output/MotionGram-com.motiongram.app-purple.apk
          retention-days: 14
          if-no-files-found: error
