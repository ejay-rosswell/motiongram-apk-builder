name: Build MotionGram Android APK (iOS 1:1 Mod)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    name: Build Native Telegram Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free Disk Space on Runner
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout Telegram Android Source (DrKlo)
        uses: actions/checkout@v4
        with:
          repository: 'DrKlo/Telegram'
          submodules: 'recursive'
          fetch-depth: 1

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Exact NDK 27.2.12479018 via sdkmanager
        run: |
          echo "Installing NDK version 27.2.12479018..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          df -h

      - name: Configure Telegram API Credentials & MotionGram Identity
        run: |
          cat <<EOF > local.properties
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_HOME/ndk/27.2.12479018
          APP_ID=31757989
          APP_HASH=c75cf21b4b0e26bbc878f74dd298ba72
          EOF

          # Rename Application display name to MotionGram
          sed -i 's/<string name="AppName">Telegram<\/string>/<string name="AppName">MotionGram<\/string>/g' TMessagesProj/src/main/res/values/strings.xml || true
          sed -i 's/<string name="AppNameBeta">Telegram Beta<\/string>/<string name="AppNameBeta">MotionGram<\/string>/g' TMessagesProj/src/main/res/values/strings.xml || true

      - name: Set Custom Package Name to com.motiongram.app
        run: |
          echo "Configuring package name (applicationId) to com.motiongram.app..."
          # Update applicationId in build.gradle files
          find . -name "build.gradle" -exec sed -i 's/applicationId "org.telegram.messenger.web"/applicationId "com.motiongram.app"/g' {} + || true
          find . -name "build.gradle" -exec sed -i 's/applicationId "org.telegram.messenger"/applicationId "com.motiongram.app"/g' {} + || true
          find . -name "build.gradle" -exec sed -i 's/applicationId "org.telegram.messenger.beta"/applicationId "com.motiongram.app"/g' {} + || true
          find . -name "*.gradle" -exec sed -i 's/"org.telegram.messenger.web"/"com.motiongram.app"/g' {} + || true

      - name: Set Unique Purple Motion Vector Icon (XML Vector Replacement)
        run: |
          echo "Writing custom Purple Motion Vector Icon..."
          cat << 'EOF' > /tmp/ic_launcher_purple.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="512dp"
              android:height="512dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
              <path
                  android:pathData="M115,0 L397,0 C460,0 512,52 512,115 L512,397 C512,460 460,512 397,512 L115,512 C52,512 0,460 0,397 L0,115 C0,52 52,0 115,0 Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="512"
                          android:endY="512"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#FF4C1D95" />
                          <item android:offset="0.5" android:color="#FF7C3AED" />
                          <item android:offset="1.0" android:color="#FFC026D3" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:pathData="M140,320 C120,220 200,130 310,130 C370,130 400,170 380,230 C360,290 310,330 240,330"
                  android:strokeColor="#FFE879F9"
                  android:strokeWidth="26"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M372,192 C392,292 312,382 202,382 C142,382 112,342 132,282 C152,222 202,182 272,182"
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="20"
                  android:strokeLineCap="round"
                  android:strokeAlpha="0.9" />
              <path
                  android:pathData="M180,300 L225,210 L256,260 L287,210 L332,300"
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="24"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round" />
              <path
                  android:pathData="M256,256 m-14,0 a14,14 0 1,1 28,0 a14,14 0 1,1 -28,0"
                  android:fillColor="#FFFDE047" />
              <path
                  android:pathData="M395,95 m-14,0 a14,14 0 1,1 28,0 a14,14 0 1,1 -28,0"
                  android:fillColor="#FFF43F5E" />
          </vector>
          EOF

          # Overwrite only XML-based adaptive launcher icons cleanly
          find . -name "ic_launcher*.xml" -exec cp /tmp/ic_launcher_purple.xml {} + || true

      - name: Inject 1:1 iOS UI Theme, Bubble Radius & Colors
        run: |
          cat << 'EOF' > TMessagesProj/src/main/res/values/colors_ios_motiongram.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ios_telegram_blue">#007AFF</color>
              <color name="ios_bubble_out">#E1FEC6</color>
              <color name="ios_bubble_in">#FFFFFF</color>
              <color name="ios_chat_bg">#EFEFF4</color>
              <color name="ios_header_bg">#F6F6F6</color>
              <color name="ios_ticks">#3B9844</color>
          </resources>
          EOF

      - name: Build MotionGram Standalone APK (arm64-v8a)
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug -PtargetAbi=arm64-v8a --no-daemon --stacktrace

      - name: Locate & Rename Generated APK
        run: |
          echo "Locating built APK..."
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          echo "Found APK at: $APK_FILE"
          mkdir -p apk_output
          cp "$APK_FILE" apk_output/MotionGram-iOS.apk

      - name: Upload MotionGram APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionGram-iOS-APK
          path: apk_output/MotionGram-iOS.apk
          retention-days: 14
          if-no-files-found: error
