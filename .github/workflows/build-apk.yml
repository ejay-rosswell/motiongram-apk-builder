name: Build MotionGram Android APK (iOS 1:1 Mod)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    name: Build Native Telegram Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free Disk Space on Runner
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout Telegram Android Source (DrKlo)
        uses: actions/checkout@v4
        with:
          repository: 'DrKlo/Telegram'
          submodules: 'recursive'
          fetch-depth: 1

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Exact NDK 27.2.12479018 via sdkmanager
        run: |
          echo "Installing NDK version 27.2.12479018 required by DrKlo/Telegram..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          df -h

      - name: Configure Telegram API Credentials & MotionGram Identity
        run: |
          cat <<EOF > local.properties
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_HOME/ndk/27.2.12479018
          APP_ID=31757989
          APP_HASH=c75cf21b4b0e26bbc878f74dd298ba72
          EOF

          sed -i 's/<string name="AppName">Telegram<\/string>/<string name="AppName">MotionGram<\/string>/g' TMessagesProj/src/main/res/values/strings.xml || true
          sed -i 's/<string name="AppNameBeta">Telegram Beta<\/string>/<string name="AppNameBeta">MotionGram<\/string>/g' TMessagesProj/src/main/res/values/strings.xml || true

      - name: Inject 1:1 iOS UI Theme, Bubble Radius & Colors
        run: |
          cat << 'EOF' > TMessagesProj/src/main/res/values/colors_ios_motiongram.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ios_telegram_blue">#007AFF</color>
              <color name="ios_bubble_out">#E1FEC6</color>
              <color name="ios_bubble_in">#FFFFFF</color>
              <color name="ios_chat_bg">#EFEFF4</color>
              <color name="ios_header_bg">#F6F6F6</color>
              <color name="ios_ticks">#3B9844</color>
          </resources>
          EOF

      - name: Build MotionGram Standalone APK (arm64-v8a)
        run: |
          chmod +x ./gradlew
          # Build Standalone APK which produces standard apk file
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug -PtargetAbi=arm64-v8a --no-daemon --stacktrace

      - name: Locate Generated APKs
        run: |
          echo "Searching for built APK files..."
          find . -name "*.apk" -type f -exec ls -la {} +

      - name: Upload MotionGram APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionGram-iOS-APK
          path: '**/*.apk'
          retention-days: 14
          if-no-files-found: error
