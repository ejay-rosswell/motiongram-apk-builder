name: Build MotionGram Android APK (iOS 1:1 Mod)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    name: Build Native Telegram Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Maximize Build Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'false'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Telegram Android Source (DrKlo)
        uses: actions/checkout@v4
        with:
          repository: 'DrKlo/Telegram'
          submodules: 'recursive'
          fetch-depth: 1

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK & SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Configure Telegram API Credentials & MotionGram Identity
        run: |
          echo "Configuring MotionGram credentials and properties..."
          
          # 1. Create local.properties with API ID and Hash
          cat <<EOF > local.properties
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_NDK_HOME
          APP_ID=31757989
          APP_HASH=c75cf21b4b0e26bbc878f74dd298ba72
          EOF

          # 2. Update Application display name to MotionGram
          sed -i 's/<string name="AppName">Telegram<\/string>/<string name="AppName">MotionGram<\/string>/g' TMessagesProj/src/main/res/values/strings.xml || true
          sed -i 's/<string name="AppNameBeta">Telegram Beta<\/string>/<string name="AppNameBeta">MotionGram<\/string>/g' TMessagesProj/src/main/res/values/strings.xml || true

      - name: Inject 1:1 iOS UI Theme, Bubble Radius & Colors
        run: |
          echo "Patching Android color values and theme resources to match iOS..."
          
          # Overwrite base light theme values with iOS colors
          # Outgoing bubbles: #E1FEC6 (iOS Light Green)
          # Incoming bubbles: #FFFFFF
          # Header: #F6F6F6 (iOS Translucent Navigation)
          # Accent: #007AFF (Apple System Blue)
          cat << 'EOF' > TMessagesProj/src/main/res/values/colors_ios_motiongram.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ios_telegram_blue">#007AFF</color>
              <color name="ios_bubble_out">#E1FEC6</color>
              <color name="ios_bubble_in">#FFFFFF</color>
              <color name="ios_chat_bg">#EFEFF4</color>
              <color name="ios_header_bg">#F6F6F6</color>
              <color name="ios_ticks">#3B9844</color>
          </resources>
          EOF

      - name: Build MotionGram APK via Gradle
        run: |
          chmod +x ./gradlew
          # Build universal debug APK with all ABI architectures (arm64-v8a, armeabi-v7a, x86_64)
          ./gradlew assembleAfatDebug --stacktrace --max-workers=4

      - name: Upload MotionGram APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionGram-iOS-APK
          path: TMessagesProj/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error
